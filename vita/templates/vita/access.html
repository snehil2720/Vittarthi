<h1>Admin Dashboard</h1>

<table border="1">

    <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Email</th>
        <th>Role</th>
        <th>Action</th>
    </tr>

    {% for user in users %}

    <tr>

        <td>{{ user.id }}</td>
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>

        <td>

            <form method="POST" action="{% url 'change_role' user.id %}">
                {% csrf_token %}

                <select name="role">

                    <option value="user">User</option>
                    <option value="writer">Writer</option>
                    <option value="admin">Admin</option>

                </select>

                <button type="submit">
                    Update
                </button>

            </form>

        </td>

    </tr>

    {% endfor %}

</table>
