{% extends 'base.html' %}

{% block title %}Sitemap | Vittarthi{% endblock %}

{% block content %}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">

<div class="sm-root">

  <!-- Animated BG blobs -->
  <div class="sm-blob sm-blob--1"></div>
  <div class="sm-blob sm-blob--2"></div>
  <div class="sm-blob sm-blob--3"></div>
  <div class="sm-noise"></div>

  <div class="sm-wrap">

    <!-- Header -->
    <header class="sm-header">
      <div class="sm-eyebrow">
        <span class="sm-eyebrow__dot"></span>
        Index Directory
        <span class="sm-eyebrow__dot"></span>
      </div>
      <h1 class="sm-title">
        <span class="sm-title__line">Site</span><span class="sm-title__accent">map</span>
      </h1>
      <p class="sm-subtitle">Every corner of Vittarthi, mapped &amp; ready to explore.</p>
    </header>

    <!-- Grid -->
    <div class="sm-grid">
      {% for sm in sitemaps %}
      <a href="{{ sm.url }}" class="sm-card" style="--i: {{ loop.index }}">
        <div class="sm-card__glow"></div>

        <div class="sm-card__icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
          </svg>
        </div>

        <div class="sm-card__body">
          <p class="sm-card__title">{{ sm.title }}</p>
          <p class="sm-card__desc">{{ sm.desc }}</p>
        </div>

        <div class="sm-card__footer">
          <span class="sm-card__url">{{ sm.url }}</span>
          <span class="sm-card__arrow">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </span>
        </div>
      </a>
      {% endfor %}
    </div>

  </div>
</div>

<style>
/* ============================================
   RESET & TOKENS
============================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* --bg:        #ffffff; */
  --surface: #fff;
  --surface-h: rgba(255,255,255,0.07);
  --border:    rgba(255,255,255,0.08);
  --border-h:  rgba(255,255,255,0.18);
  --text-1:    #000000;
  --text-2:    rgba(0, 0, 0, 0.986);
  --accent-a:  #6C63FF;
  --accent-b:  #00D4FF;
  --accent-c:  #FF6584; 
  --glow-a:    rgba(108,99,255,0.35);
  --glow-b:    rgba(0,212,255,0.25);
  --radius:    20px;
  --font-head: 'Syne', sans-serif;
  --font-body: 'DM Sans', sans-serif;
}

/* ============================================
   ROOT WRAPPER
============================================ */
.sm-root {
  position: relative;
  min-height: 100vh;
  background: var(--bg);
  overflow: hidden;
  padding: 0 0 100px;
}

/* ============================================
   NOISE TEXTURE
============================================ */
.sm-noise {
  position: fixed;
  inset: -50%;
  width: 200%;
  height: 200%;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
  opacity: 0.028;
  pointer-events: none;
  z-index: 0;
}

/* ============================================
   ANIMATED BLOBS
============================================ */
.sm-blob {
  position: fixed;
  border-radius: 50%;
  filter: blur(90px);
  pointer-events: none;
  z-index: 0;
}

.sm-blob--1 {
  width: 600px; height: 600px;
  background: radial-gradient(circle, var(--accent-a) 0%, transparent 70%);
  top: -180px; left: -160px;
  opacity: 0.22;
  animation: blob-drift-1 14s ease-in-out infinite alternate;
}

.sm-blob--2 {
  width: 500px; height: 500px;
  background: radial-gradient(circle, var(--accent-b) 0%, transparent 70%);
  bottom: -100px; right: -120px;
  opacity: 0.18;
  animation: blob-drift-2 18s ease-in-out infinite alternate;
}

.sm-blob--3 {
  width: 350px; height: 350px;
  background: radial-gradient(circle, var(--accent-c) 0%, transparent 70%);
  top: 50%; left: 55%;
  opacity: 0.12;
  animation: blob-drift-3 22s ease-in-out infinite alternate;
}

@keyframes blob-drift-1 { from { transform: translate(0,0) scale(1); } to { transform: translate(60px,40px) scale(1.12); } }
@keyframes blob-drift-2 { from { transform: translate(0,0) scale(1); } to { transform: translate(-50px,-30px) scale(1.08); } }
@keyframes blob-drift-3 { from { transform: translate(0,0) scale(1); } to { transform: translate(40px,50px) scale(1.15); } }

/* ============================================
   WRAPPER
============================================ */
.sm-wrap {
  position: relative;
  z-index: 0;
  max-width: 1200px;
  margin: 0 auto;
  padding: 80px 24px 0;
}

/* ============================================
   HEADER
============================================ */
.sm-header {
  text-align: center;
  margin-bottom: 72px;
  animation: fade-up 0.8s cubic-bezier(0.22,1,0.36,1) both;
}

.sm-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent-b);
  background: rgba(0,212,255,0.08);
  border: 1px solid rgba(0,212,255,0.18);
  padding: 8px 18px;
  border-radius: 100px;
  margin-bottom: 28px;
}

.sm-eyebrow__dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--accent-b);
  animation: pulse-dot 1.8s ease-in-out infinite;
}

@keyframes pulse-dot {
  0%,100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.4; transform: scale(0.6); }
}

.sm-title {
  font-family: var(--font-head);
  font-size: clamp(64px, 10vw, 110px);
  font-weight: 800;
  line-height: 0.92;
  letter-spacing: -0.03em;
  color: var(--text-1);
  margin-bottom: 24px;
}

.sm-title__line {
  display: inline-block;
}

.sm-title__accent {
  display: inline-block;
  background: linear-gradient(135deg, var(--accent-a) 0%, var(--accent-b) 50%, var(--accent-c) 100%);
  -webkit-background-clip: text;
  /* -webkit-text-fill-color: transparent; */
  background-clip: text;
}

.sm-subtitle {
  font-family: var(--font-body);
  font-size: 18px;
  font-weight: 300;
  color: var(--text-2);
  letter-spacing: 0.01em;
  max-width: 420px;
  margin: 0 auto;
  line-height: 1.6;
}

/* ============================================
   GRID
============================================ */
.sm-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 20px;
}

/* ============================================
   CARD
============================================ */
.sm-card {
  --delay: calc(var(--i, 1) * 70ms);
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding: 28px;
  border-radius: var(--radius);
  background: rgb(98 91 91 / 15%);
  border: 1px solid var(--border);
  text-decoration: none;
  overflow: hidden;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: border-color 0.35s ease, transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.35s ease;
  animation: fade-up 0.7s cubic-bezier(0.22,1,0.36,1) var(--delay) both;
  cursor: pointer;
}

.sm-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(108,99,255,0.06) 0%, rgba(0,212,255,0.04) 100%);
  opacity: 0;
  transition: opacity 0.35s ease;
  border-radius: inherit;
}

.sm-card:hover {
  border-color: var(--border-h);
  transform: translateY(-6px) scale(1.01);
  box-shadow:
    0 0 0 1px rgba(108,99,255,0.15),
    0 24px 48px -12px rgba(0,0,0,0.6),
    0 0 60px -20px var(--glow-a);
}

.sm-card:hover::before { opacity: 1; }

/* Glow orb on hover */
.sm-card__glow {
  position: absolute;
  width: 200px; height: 200px;
  background: radial-gradient(circle, var(--accent-a) 0%, transparent 70%);
  border-radius: 50%;
  top: -60px; right: -60px;
  opacity: 0;
  filter: blur(30px);
  pointer-events: none;
  transition: opacity 0.5s ease;
}

.sm-card:hover .sm-card__glow { opacity: 0.18; }

/* Icon */
.sm-card__icon {
  width: 48px; height: 48px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(108,99,255,0.12);
  border: 1px solid rgba(108,99,255,0.2);
  border-radius: 14px;
  color: var(--accent-b);
  flex-shrink: 0;
  transition: background 0.3s ease, transform 0.3s ease, color 0.3s ease;
}

.sm-card__icon svg { width: 22px; height: 22px; }

.sm-card:hover .sm-card__icon {
  background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
  border-color: transparent;
  color: #fff;
  transform: rotate(-6deg) scale(1.08);
}

/* Body */
.sm-card__body { flex: 1; }

.sm-card__title {
  font-family: var(--font-head);
  font-size: 20px;
  font-weight: 700;
  color: var(--text-1);
  margin-bottom: 8px;
  letter-spacing: -0.02em;
  line-height: 1.2;
}

.sm-card__desc {
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 300;
  color: var(--text-2);
  line-height: 1.6;
}

/* Footer */
.sm-card__footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 18px;
  border-top: 1px solid var(--border);
  gap: 12px;
  margin-top: auto;
}

.sm-card__url {
  font-family: var(--font-body);
  font-size: 16px;
  font-weight: 500;
  color: rgba(0, 81, 255, 0.7);
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 82%;
  transition: color 0.3s ease;
}

.sm-card:hover .sm-card__url { color: var(--accent-b); }

.sm-card__arrow {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 50%;
  color: var(--text-2);
  flex-shrink: 0;
  transition: background 0.3s ease, border-color 0.3s ease, transform 0.35s cubic-bezier(0.34,1.56,0.64,1), color 0.3s ease;
}

.sm-card__arrow svg { width: 14px; height: 14px; }

.sm-card:hover .sm-card__arrow {
  background: var(--accent-a);
  border-color: var(--accent-a);
  color: #fff;
  transform: translateX(3px);
}

/* ============================================
   ANIMATION
============================================ */
@keyframes fade-up {
  from { opacity: 0; transform: translateY(28px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ============================================
   RESPONSIVE
============================================ */
@media (max-width: 600px) {
  .sm-grid { grid-template-columns: 1fr; }
  .sm-title { font-size: clamp(52px, 15vw, 80px); }
  .sm-header { margin-bottom: 48px; }
  .sm-card { padding: 22px; }
}
.navbar {

}

/* ============================================
   LIGHT MODE OVERRIDE (if base.html toggles .dark/.light on <html>)
   — keeps dark theme regardless; remove if unwanted
============================================ */
</style>

{% endblock %}
