{% extends 'base.html' %}

{% block content %}

<h2>📂 My Blogs</h2>

<table class="table">
    <thead>
        <tr>
            <th>Title</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody>
        {% for blog in blogs %}
        <tr>
            <td>{{ blog.title }}</td>
            <td>{{ blog.status }}</td>
            <td>
                <a href="{% url 'edit_blog' blog.id %}" class="btn btn-sm btn-primary">
                    Edit
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
