{% extends 'base.html' %}
{% block content %}

{% load static %}

<style>
    /* ══════════ WRITE BLOG UI ══════════ */
    .editor-wrapper {
        max-width: 900px;
        margin: 2rem auto 4rem;
        animation: fadeUp 0.5s ease both;
    }
    
    .editor-header {
        text-align: center;
        margin-bottom: 2rem;
    }
    
    .editor-header h1 {
        font-family: 'DM Serif Display', serif;
        font-size: clamp(2rem, 4vw, 2.8rem);
        color: var(--text);
        margin-bottom: 0.5rem;
    }
    
    .editor-header p {
        color: var(--muted);
        font-size: 1.05rem;
    }

    .form-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r);
        padding: clamp(1.5rem, 4vw, 3rem);
        box-shadow: var(--shadow-lg);
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-label {
        display: block;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 0.5rem;
        font-size: 0.95rem;
    }

    .custom-input, .custom-select {
        width: 100%;
        padding: 12px 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-family: inherit;
        font-size: 1rem;
        transition: all 0.2s ease;
    }

    .custom-input:focus, .custom-select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-lt);
    }

    .custom-file-input {
        padding: 8px;
    }

    .custom-file-input::file-selector-button {
        background: var(--surface2);
        border: 1px solid var(--border);
        padding: 8px 16px;
        border-radius: 6px;
        color: var(--text);
        cursor: pointer;
        margin-right: 15px;
        transition: background 0.2s;
    }

    .custom-file-input::file-selector-button:hover {
        background: var(--border);
    }

    /* Grid for side-by-side inputs on Desktop */
    .input-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1.5rem;
    }

    .submit-btn {
        width: 100%;
        padding: 14px;
        font-size: 1.1rem;
        margin-top: 1rem;
    }

    /* Make CKEditor fit theme */
    .django-ckeditor-widget {
        width: 100% !important;
    }
</style>

<main class="page">
    <div class="editor-wrapper">
        
        <div class="editor-header">
            <h1>✍️ Write a New Blog</h1>
            <p>Share your financial insights and guides with the community.</p>
        </div>

        <div class="form-card">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="form-group">
                    <label class="form-label">Article Title</label>
                    <input type="text" name="title" class="custom-input" placeholder="e.g., Understanding Mutual Funds for Beginners" required>
                </div>

                <div class="input-grid form-group">
                    <div>
                        <label class="form-label">Category</label>

                        <div style="display:flex; gap:10px;">
                            <select name="category" id="categorySelect" class="custom-select" required>
                                <option value="" disabled selected>Select a category...</option>
                                {% for cat in categories %}
                                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                                {% endfor %}
                            </select>

                            <!-- ➕ button -->
                            <button type="button" onclick="openCategoryModal()" class="btn btn-outline-primary">
                                +
                            </button>
                            <button type="button" onclick="deleteCategory()" class="btn btn-outline-danger">🗑</button>
                        </div>
                    </div>
<!-- 🔥 CATEGORY MODAL -->
<div id="categoryModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999;">
    <div style="background:white; padding:20px; max-width:400px; margin:10% auto; border-radius:10px;">
        <h4>Add Category</h4>
        <input type="text" id="newCategoryName" class="custom-input" placeholder="Enter category name">

        <div style="margin-top:15px; display:flex; justify-content:flex-end; gap:10px;">
            <button onclick="closeCategoryModal()" class="btn btn-secondary">Cancel</button>
            <button onclick="saveCategory()" class="btn btn-primary">Save</button>
        </div>
    </div>
</div>
                    <div>
                        <label class="form-label">Custom URL Slug (Optional)</label>
                        <input type="text" name="slug" class="custom-input" placeholder="e.g., mutual-funds-beginners">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Content</label>
                    <textarea name="content" id="editor"></textarea>
                </div>

                <div class="input-grid form-group">
                    <div>
                        <label class="form-label">Cover Image</label>
                        <input type="file" name="image" class="custom-input custom-file-input" accept="image/*">
                        <img id="imagePreview" style="display:none; max-width:100%; margin-top:10px; border-radius:8px;" />
                    </div>

                    <div>
                        <label class="form-label">Publish Status</label>
                        <select name="status" class="custom-select">
                            <option value="draft">📁 Save as Draft</option>
                            <option value="published" selected>🚀 Publish Immediately</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary submit-btn">
                    <i class="bi bi-cloud-arrow-up-fill"></i> Save & Publish
                </button>

            </form>
        </div>
    </div>
</main>

<script src="{% static 'ckeditor/ckeditor/ckeditor.js' %}"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        if (typeof CKEDITOR !== 'undefined') {
            CKEDITOR.replace('editor', {
                height: 350, 
                filebrowserUploadUrl: '/ckeditor/upload/',
                filebrowserUploadMethod: 'form',
                uiColor: '#ffffff', 
            });
        } else {
            console.error("CKEditor not loaded! Please check static paths.");
        }
    });
document.querySelector("input[name='title']").addEventListener("input", function() {
    let slugField = document.querySelector("input[name='slug']");
    
    if(slugField.dataset.manual === "true") return;

    let slug = this.value
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/(^-|-$)/g, '');

    slugField.value = slug;
});

document.querySelector("input[name='slug']").addEventListener("input", function() {
    this.dataset.manual = "true";
});
document.querySelector("input[name='image']").addEventListener("change", function(e) {
    const file = e.target.files[0];
    const preview = document.getElementById("imagePreview");

    if (file) {
        const reader = new FileReader();

        reader.onload = function(event) {
            preview.src = event.target.result;
            preview.style.display = "block";
        };

        reader.readAsDataURL(file);
    }
});
function openCategoryModal() {
    document.getElementById("categoryModal").style.display = "block";
}

function closeCategoryModal() {
    document.getElementById("categoryModal").style.display = "none";
}

function saveCategory() {
    const name = document.getElementById("newCategoryName").value;
    const csrf = document.querySelector('[name=csrfmiddlewaretoken]').value;

    if (!name) {
        alert("Enter category name");
        return;
    }

    fetch("/add-category/", {
        method: "POST",
        headers: {
            "X-CSRFToken": csrf,
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ name: name })
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === "success") {

            let select = document.getElementById("categorySelect");

            let option = document.createElement("option");
            option.value = data.id;
            option.text = data.name;
            option.selected = true;

            select.appendChild(option);

            closeCategoryModal();
            document.getElementById("newCategoryName").value = "";

        } else {
            alert(data.message);
        }
    })
    .catch(err => console.error(err));
}
function deleteCategory() {

    const select = document.getElementById("categorySelect");
    const categoryId = select.value;
    const csrf = document.querySelector('[name=csrfmiddlewaretoken]').value;

    if (!categoryId) {
        alert("Select category first");
        return;
    }

    if (!confirm("Delete this category?")) return;

    fetch(`/delete-category/${categoryId}/`, {
        method: "POST",
        headers: {
            "X-CSRFToken": csrf
        }
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === "success") {

            select.querySelector(`option[value="${categoryId}"]`).remove();

            select.value = "";
        } else {
            alert(data.message);
        }
    })
    .catch(err => console.error(err));
}
</script>
{% endblock %}
