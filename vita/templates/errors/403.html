{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="error-page-container">
    <div class="error-content-wrapper">
        <div class="svg-illustration">
            <svg width="100%" height="auto" viewBox="0 0 500 350" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="250" cy="180" r="140" fill="#FFFBEB" />
                <rect x="70" y="80" width="50" height="50" rx="12" transform="rotate(-20 70 80)" fill="#FEF2F2" />
                <circle cx="420" cy="240" r="25" fill="#F0FDF4" />

                <path d="M250 70 L340 100 L340 200 C340 260 250 310 250 310 C250 310 160 260 160 200 L160 100 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="6" stroke-linejoin="round" />

                <g class="secure-lock">
                    <path d="M210 180 V 140 C210 115 290 115 290 140 V 180" stroke="#94A3B8" stroke-width="16" stroke-linecap="round" />
                    <rect x="180" y="180" width="140" height="90" rx="16" fill="#1E293B" />
                    <circle cx="250" cy="215" r="12" fill="#F59E0B" />
                    <path d="M244 220 L240 245 H260 L256 220 Z" fill="#F59E0B" />
                </g>

                <g class="pulse-warning">
                    <circle cx="330" cy="110" r="8" fill="#EF4444" />
                </g>
                <g class="pulse-warning" style="animation-delay: 1s;">
                    <circle cx="170" cy="200" r="6" fill="#F59E0B" />
                </g>
            </svg>
        </div>

        <div class="text-content">
            <h1 class="gradient-text-403">403</h1>
            <h2>Access Denied!</h2>
            <p>
                Hold your horses! You don't have the necessary permissions to view this page. It's locked up tight.
            </p>
        </div>

        <div class="action-buttons">
            <button onclick="history.back()" class="home-btn-modern primary-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Go Back
            </button>
            <a href="/" class="home-btn-modern secondary-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                Home
            </a>
        </div>
    </div>
</div>

<style>
/* Modern Font Import */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Poppins:wght@700;800&display=swap');

.error-page-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    padding-bottom: 10px;
    font-family: 'Inter', sans-serif;
}
.mt-4 {
    margin-top: 0px !important;
    padding: 0px;
}
.error-content-wrapper {
    text-align: center;
    max-width: 600px;
    width: 100%;
}

/* SVG Styling & Animations */
.svg-illustration {
    max-width: 450px;
    margin: 0 auto 30px auto;
}

.secure-lock {
    animation: lockPulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    transform-origin: center;
}

.pulse-warning {
    animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    transform-origin: center;
}

@keyframes lockPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); }
}

@keyframes ping {
    75%, 100% {
        transform: scale(2);
        opacity: 0;
    }
}

/* Text Styling */
.gradient-text-403 {
    font-family: 'Poppins', sans-serif;
    font-size: 120px;
    font-weight: 800;
    line-height: 1;
    margin: 0;
    /* Security/Warning Gradient (Amber to Red) */
    background: linear-gradient(135deg, #F59E0B 0%, #EF4444 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -4px;
}

.text-content h2 {
    color: #1e293b;
    font-size: 36px;
    font-weight: 700;
    margin-top: 10px;
    margin-bottom: 15px;
}

.text-content p {
    color: #64748b;
    font-size: 17px;
    line-height: 1.7;
    margin-bottom: 40px;
    padding: 0 20px;
}

/* Sleek Modern Buttons */
.action-buttons {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
}

.home-btn-modern {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 32px;
    text-decoration: none;
    border-radius: 14px;
    font-weight: 600;
    font-size: 16px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: none;
    cursor: pointer;
    font-family: inherit;
}

/* Primary Button (Go Back) */
.primary-btn {
    background: #1e293b;
    color: #ffffff;
    box-shadow: 0 10px 15px -3px rgba(30, 41, 59, 0.2);
}

.primary-btn:hover {
    background: #0f172a;
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 20px 25px -5px rgba(30, 41, 59, 0.3);
}

.primary-btn svg {
    transition: transform 0.3s ease;
}

.primary-btn:hover svg {
    transform: translateX(-4px);
}

/* Secondary Button (Home) */
.secondary-btn {
    background: #f1f5f9;
    color: #475569;
}

.secondary-btn:hover {
    background: #e2e8f0;
    color: #1e293b;
    transform: translateY(-3px);
}

/* Mobile Responsiveness */
@media (max-width: 640px) {
    .gradient-text-403 { font-size: 90px; }
    .text-content h2 { font-size: 28px; }
    .error-content-wrapper { padding: 0 10px; }
    .svg-illustration { max-width: 320px; }
    .action-buttons { flex-direction: column; padding: 0 20px; }
    .home-btn-modern { justify-content: center; width: 100%; box-sizing: border-box; }
}
</style>
{% endblock %}
